name: CI
on: [push]
jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build Image and Run Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.VULN_USER }}
          password: ${{ secrets.VULN_PWD }}
      - name: Build and Push Docker Image
        run: |
          docker build -f Dockerfile -t ${{ secrets.VULN_USER }}/myapp:latest .
          docker push ${{ secrets.VULN_USER }}/myapp:latest
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.VULN_USER }}
          dockerhub-password: ${{ secrets.VULN_PWD }}
          command: quickview,cves
          image: registry=${{ secrets.VULN_USER }}/myapp:latest
          only-severities: critical,high
          sarif-file: scout-report.sarif
          exit-code: false
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scout-findings
          path: scout-report.sarif
